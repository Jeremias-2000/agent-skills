<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="agent-skills — reusable skills for coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="node-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79b8ff"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="880" height="200" rx="16" fill="url(#bg)"/>

  <!-- Agent node graph -->
  <g stroke="#58a6ff" stroke-width="2" opacity="0.85">
    <line x1="140" y1="100" x2="215" y2="50"/>
    <line x1="140" y1="100" x2="215" y2="100"/>
    <line x1="140" y1="100" x2="215" y2="150"/>
  </g>
  <g fill="#58a6ff">
    <circle cx="215" cy="50" r="5"/>
    <circle cx="215" cy="100" r="5"/>
    <circle cx="215" cy="150" r="5"/>
  </g>

  <!-- Central hub -->
  <g transform="translate(140,100)">
    <circle r="42" fill="#21262d"/>
    <circle r="42" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>
    <circle r="27" fill="url(#node-core)"/>
    <path d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z" fill="#0d1117"/>
  </g>

  <!-- Title + tagline -->
  <text x="300" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f0f3f6">agent-skills</text>
  <text x="302" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">Reusable, composable skills for coding agents</text>

  <!-- Single neutral badge -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#58a6ff">
    <rect x="302" y="150" width="150" height="26" rx="13" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <text x="377" y="168" text-anchor="middle">SKILL.md format</text>
  </g>
</svg>
